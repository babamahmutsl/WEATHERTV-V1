name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: HavaTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Surumu yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HavaTV.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HavaTV.apk \
            --target "${{ github.sha }}" \
            --title "HavaTV (son sürüm)" \
            --notes "Otomatik derleme: ${{ github.sha }}"
